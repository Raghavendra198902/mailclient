version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gmail-ai-postgres
    environment:
      POSTGRES_USER: gmail_user
      POSTGRES_PASSWORD: gmail_pass
      POSTGRES_DB: gmail_ai
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmail_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gmail-ai-redis
    ports:
      - "6382:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gmail-ai-backend
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql://gmail_user:gmail_pass@postgres:5432/gmail_ai
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ml-worker:
    build:
      context: ./ml_pipeline
      dockerfile: Dockerfile
    container_name: gmail-ai-ml-worker
    environment:
      - DATABASE_URL=postgresql://gmail_user:gmail_pass@postgres:5432/gmail_ai
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./ml_pipeline:/app
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
    command: python worker.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: gmail-ai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
