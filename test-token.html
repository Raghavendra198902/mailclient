<!DOCTYPE html>
<html>
<head>
    <title>Token Test</title>
</head>
<body>
    <h1>Gmail AI Manager - Token Test</h1>
    <div id="status"></div>
    <hr>
    <h2>Step 1: Get Token</h2>
    <button onclick="getToken()">Get Dev Token</button>
    <div id="token-display"></div>
    
    <hr>
    <h2>Step 2: Fetch Messages</h2>
    <button onclick="fetchMessages()">Fetch Messages</button>
    <div id="messages-display"></div>

    <script>
        let token = null;

        async function getToken() {
            const response = await fetch('http://localhost:8003/api/v1/auth/dev/token/1');
            const data = await response.json();
            token = data.access_token;
            localStorage.setItem('access_token', token);
            document.getElementById('token-display').innerHTML = 
                `<p>✅ Token received and stored!</p><pre>${token.substring(0, 50)}...</pre>`;
            document.getElementById('status').innerHTML = '✅ Token stored in localStorage';
        }

        async function fetchMessages() {
            if (!token) {
                token = localStorage.getItem('access_token');
            }
            
            if (!token) {
                document.getElementById('messages-display').innerHTML = 
                    '<p style="color: red;">❌ No token found. Get token first!</p>';
                return;
            }

            try {
                const response = await fetch('http://localhost:8003/api/v1/messages/?folder=inbox&limit=5', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                let html = `<h3>✅ ${data.total} total messages found!</h3>`;
                html += '<h4>First 5 messages:</h4><ul>';
                data.messages.forEach(msg => {
                    html += `<li><strong>${msg.subject}</strong><br>From: ${msg.from_email}</li>`;
                });
                html += '</ul>';
                
                document.getElementById('messages-display').innerHTML = html;
                document.getElementById('status').innerHTML = '✅ Messages loaded successfully!';
            } catch (error) {
                document.getElementById('messages-display').innerHTML = 
                    `<p style="color: red;">❌ Error: ${error.message}</p>`;
                document.getElementById('status').innerHTML = `❌ Error: ${error.message}`;
            }
        }

        // Auto-load token from localStorage on page load
        window.onload = function() {
            const storedToken = localStorage.getItem('access_token');
            if (storedToken) {
                token = storedToken;
                document.getElementById('status').innerHTML = '✅ Token found in localStorage';
            } else {
                document.getElementById('status').innerHTML = '⚠️ No token in localStorage';
            }
        };
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            padding: 10px;
            margin: 20px 0;
            background: #f0f0f0;
            border-radius: 4px;
        }
        pre {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #f9f9f9;
            margin: 10px 0;
            padding: 10px;
            border-left: 4px solid #4CAF50;
        }
    </style>
</body>
</html>
